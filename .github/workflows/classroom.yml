name: Classroom unified autograding

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out starter repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            task/*/requirements.txt
      - name: Install shared grading dependencies
        run: python -m pip install -r requirements.txt
      - name: Detect selected task
        id: detect
        run: |
          python grader/run_grading.py --detect-task | tee detection.txt
          task=$(sed -n 's/^TASK_ID=//p' detection.txt)
          echo "task=$task" >> "$GITHUB_OUTPUT"
      - name: Install selected task dependencies
        run: python -m pip install -r "task/${{ steps.detect.outputs.task }}/requirements.txt"
        timeout-minutes: 12
      - name: Execute once, validate, and score
        id: grade
        continue-on-error: true
        run: |
          python grader/run_grading.py --task "${{ steps.detect.outputs.task }}" --skip-install --report-json grading-report.json
        timeout-minutes: 7
      - name: Publish student summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path=Path('grading-report.json')
          lines=['# Biomedical assignment feedback','']
          if report_path.exists():
              r=json.loads(report_path.read_text())
              lines += [f"**Detected task:** `{r['task_id']}`", f"**Score:** {r['score']['earned']}/{r['score']['maximum']}", '', '## Feedback']
              lines += [f"- {item}" for item in r['feedback']]
              lines += ['', '## Metrics', '```json', json.dumps(r['metrics'],indent=2), '```']
          else: lines += ['The task could not be detected or grading stopped before a report was created. Read the detection/installation log above for the corrective action.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('\n'.join(lines)+'\n')
          PY
      - name: Prepare Classroom score
        if: always()
        id: classroom
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              r=json.load(open('grading-report.json'))
              earned=r['score']['earned']; maximum=r['score']['maximum']
          except Exception: earned,maximum=0,100
          import json as j
          print('result='+j.dumps({'version':1,'status':'pass' if earned==maximum else 'fail','max_score':maximum,'tests':[{'name':'Biomedical assessment','score':earned,'max_score':maximum,'status':'pass' if earned==maximum else 'fail','message':f'{earned}/{maximum} points'}]},separators=(',',':')))
          PY
      - name: Classroom grading reporter
        if: always()
        uses: education/autograding-grading-reporter@v1
        env:
          BIOMED_ASSESSMENT_RESULTS: ${{ steps.classroom.outputs.result }}
        with:
          runners: biomed-assessment
      - name: Upload structured grading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-report
          path: |
            grading-report.json
            detection.txt
          if-no-files-found: warn
      - name: Fail when assessment did not complete
        if: steps.grade.outcome != 'success'
        run: exit 1

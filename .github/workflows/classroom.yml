name: Classroom unified autograding

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  autograding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install shared dependencies
        run: python -m pip install -r requirements.txt

      - name: Detect submitted task
        id: detect
        shell: bash
        run: |
          task_id="$(python grader/run_grading.py --detect-task)"
          echo "Detected task: ${task_id}"
          echo "task_id=${task_id}" >> "${GITHUB_OUTPUT}"

      - name: Sanity check
        id: sanity-check
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Sanity check (${{ steps.detect.outputs.task_id }})
          setup-command: ""
          command: python grader/run_grading.py --task ${{ steps.detect.outputs.task_id }} --sanity-only
          timeout: 6
          max-score: 20

      - name: Metric threshold
        id: metric-threshold
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Metric threshold (${{ steps.detect.outputs.task_id }})
          setup-command: ""
          command: python grader/run_grading.py --task ${{ steps.detect.outputs.task_id }}
          timeout: 6
          max-score: 80

      - name: Autograding reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          SANITY-CHECK_RESULTS: "${{ steps.sanity-check.outputs.result }}"
          METRIC-THRESHOLD_RESULTS: "${{ steps.metric-threshold.outputs.result }}"
        with:
          runners: sanity-check,metric-threshold

name: Classroom Task 1 grading

on:
  push:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  grade-task1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sanity check
        id: sanity-check
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Sanity check
          setup-command: ""
          command: python grader/run_grading.py --task task1 --sanity-only
          timeout: 6
          max-score: 20

      - name: F1 threshold
        id: f1-threshold
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: F1 threshold
          setup-command: ""
          command: python grader/run_grading.py --task task1
          timeout: 6
          max-score: 80

      - name: Autograding reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          SANITY-CHECK_RESULTS: "${{ steps.sanity-check.outputs.result }}"
          F1-THRESHOLD_RESULTS: "${{ steps.f1-threshold.outputs.result }}"
        with:
          runners: sanity-check,f1-threshold
